<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Privado 1 a 1 (Sin Base de Datos)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ece5dd;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        .header {
            background: #075e54;
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .profile .name { font-weight: bold; font-size: 15px; }
        .profile .status { font-size: 12px; opacity: 0.8; }
        .header button { background: none; border: none; color: white; font-size: 18px; cursor: pointer; margin-left: 8px; }
        .messages { flex: 1; padding: 12px; overflow-y: auto; }
        .message { background: #dcf8c6; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; max-width: 75%; font-size: 14px; }
        .input-box { display: flex; border-top: 1px solid #ccc; background: white; }
        .input-box input { flex: 1; border: none; padding: 12px; outline: none; }
        .input-box button { background: #075e54; color: white; border: none; padding: 12px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <div class="profile">
            <img src="perfil.png.png">
            <div>
                <div class="name">Soporte</div>
                <div class="status">En línea</div>
            </div>
        </div>
        <div>
            <button onclick="call()">📞</button>
            <button onclick="video()">🎥</button>
            <button onclick="back()">🗺️</button>
        </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-box">
        <input id="msg" placeholder="Escribe un mensaje...">
        <button onclick="sendMessage()">Enviar</button>
    </div>
    <script>
        const messagesDiv = document.getElementById("messages");
        let ws;
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');

        function openWebSocket() {
            // Reemplaza 'ws://localhost:8080' con la URL de tu servidor WebSocket
            ws = new WebSocket('ws://localhost:8080?room=' + roomId);

            ws.onopen = () => {
                console.log('Conectado al servidor WebSocket');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                addMessage(message.user, message.text);
            };

            ws.onclose = () => {
                console.log('Desconectado del servidor WebSocket');
                // Intenta reconectar después de un tiempo
                setTimeout(openWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('Error en WebSocket:', error);
            };
        }

        function addMessage(user, text) {
            const div = document.createElement("div");
            div.className = "message";
            div.textContent = `${user}: ${text}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById("msg");
            const text = input.value.trim();
            if (!text) return;

            // Agrega el mensaje a tu propio chat
            addMessage("Tú", text);

            // Envía el mensaje al servidor WebSocket
            ws.send(JSON.stringify({ user: "Tú", text: text, room: roomId }));
            input.value = "";
        }

        function call() { alert("Aquí se conectaría la llamada real (WebRTC)"); }
        function video() { alert("Aquí se conectaría la videollamada real (WebRTC)"); }
        function back() { window.location.href = "index.html"; }

        // Abre la conexión WebSocket al cargar la página
        openWebSocket();
    </script>
</body>
</html>
